<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>brainrouter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0e13;
  --bg2: #11151c;
  --bg3: #161b24;
  --panel: #141923;
  --border: #1f2632;
  --borderHi: #2a3343;
  --text: #e6edf6;
  --textDim: #8693a8;
  --textMute: #5a6679;
  --green: #22d39a;
  --greenDim: rgba(34,211,154,0.14);
  --cyan: #3ec5ff;
  --cyanDim: rgba(62,197,255,0.14);
  --violet: #9d7bff;
  --violetDim: rgba(157,123,255,0.16);
  --amber: #f5b14a;
  --amberDim: rgba(245,177,74,0.16);
  --red: #ff6b6b;
  --redDim: rgba(255,107,107,0.14);
  --pink: #ff7ac6;
  --pinkDim: rgba(255,122,198,0.14);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
}
button { font-family: inherit; }
input, textarea { font-family: inherit; }
textarea { resize: vertical; }
@keyframes brPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}
@keyframes brShimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.shimmer-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(34,211,154,0.4), transparent);
  background-size: 200% 100%;
  animation: brShimmer 1.8s linear infinite;
}
.pulse-dot { animation: brPulse 1.4s ease-in-out infinite; }
.br-btn {
  all: unset; cursor: pointer;
  padding: 6px 12px; border-radius: 6px;
  font-size: 12px; border: 1px solid var(--border); color: var(--textDim);
  background: transparent;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.br-btn:hover { color: var(--text); border-color: var(--borderHi); background: var(--bg3); }
.sidebar-btn {
  all: unset; cursor: pointer;
  padding: 7px 10px; border-radius: 6px;
  font-size: 12px; color: var(--textDim);
  border: 1px solid var(--border);
  text-align: left; display: block; width: 100%;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.sidebar-btn:hover { color: var(--text); border-color: var(--borderHi); background: var(--bg3); }
.sidebar-btn:disabled { opacity: 0.5; cursor: default; }
.nav-item {
  all: unset; cursor: pointer;
  padding: 8px 12px; border-radius: 8px;
  display: flex; align-items: center; gap: 10;
  font-size: 13px; color: var(--textDim);
  width: 100%;
  border-left: 2px solid transparent;
  transition: background 0.15s, color 0.15s;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active {
  background: var(--bg3);
  color: var(--text);
  border-left-color: var(--green);
}
.nav-item.active .nav-icon { color: var(--green); }
.nav-icon { font-size: 14px; width: 16px; text-align: center; color: var(--textMute); }
.filter-btn {
  all: unset; cursor: pointer;
  padding: 5px 12px; border-radius: 6px;
  font-size: 12px; color: var(--textDim);
  border: 1px solid transparent;
  transition: all 0.15s;
}
.filter-btn:hover { color: var(--text); background: var(--bg3); }
.filter-btn.active { background: var(--bg3); color: var(--text); border-color: var(--border); }
.config-input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: 10px 12px;
  font-size: 12px; font-family: 'JetBrains Mono', monospace;
  line-height: 1.6;
  outline: none;
  transition: border-color 0.15s;
}
.config-input:focus { border-color: var(--borderHi); }
.save-btn {
  all: unset; cursor: pointer;
  padding: 6px 16px; border-radius: 6px;
  font-size: 12px; background: var(--greenDim); color: var(--green);
  border: 1px solid rgba(34,211,154,0.35);
  transition: all 0.15s;
}
.save-btn:hover { background: rgba(34,211,154,0.22); }
.file-card {
  padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; display: flex; align-items: center; gap: 10;
  cursor: pointer; transition: border-color 0.15s;
}
.file-card:hover { border-color: var(--borderHi); }
</style>
</head>
<body>
<div id="app" style="display:flex;height:100vh;overflow:hidden">
<!-- SIDEBAR -->
<nav id="sidebar" style="width:224px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;font-size:13px;color:var(--text);flex-shrink:0;overflow:hidden">
  <!-- Logo -->
  <div style="padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10">
    <div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--bg);flex-shrink:0">br</div>
    <div>
      <div style="font-weight:600;letter-spacing:0.2px">brainrouter</div>
      <div style="font-size:10px;color:var(--textMute);font-family:'JetBrains Mono',monospace" id="ver-brainrouter">v—</div>
    </div>
  </div>

  <!-- Nav -->
  <nav style="padding:12px 8px;display:flex;flex-direction:column;gap:2px">
    <button class="nav-item active" id="nav-stream" onclick="switchView('stream')">
      <span class="nav-icon">◉</span>
      <span>Stream</span>
    </button>
    <button class="nav-item" id="nav-reviews" onclick="switchView('reviews')">
      <span class="nav-icon">✓</span>
      <span>Reviews</span>
      <span id="reviews-count" style="margin-left:auto;font-size:10px;padding:2px 6px;border-radius:99px;background:var(--amberDim);color:var(--amber);font-family:'JetBrains Mono',monospace;display:none">0</span>
    </button>
    <button class="nav-item" id="nav-config" onclick="switchView('config')">
      <span class="nav-icon">⚙</span>
      <span>Config</span>
    </button>
  </nav>

  <!-- System Health -->
  <div style="padding:8px 18px;font-size:10px;letter-spacing:1.5px;color:var(--textMute);margin-top:8px;text-transform:uppercase">System Health</div>
  <div style="padding:0 12px;display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px">
      <span id="dot-llama-swap" style="width:6px;height:6px;border-radius:99px;background:var(--textMute);flex-shrink:0"></span>
      <span style="color:var(--textDim);flex:1">llama-swap</span>
      <span id="ver-llama-swap" style="font-family:'JetBrains Mono',monospace;color:var(--textMute);font-size:11px">—</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px">
      <span id="dot-llama-cpp" style="width:6px;height:6px;border-radius:99px;background:var(--textMute);flex-shrink:0"></span>
      <span style="color:var(--textDim);flex:1">llama.cpp</span>
      <span id="ver-llama-cpp" style="font-family:'JetBrains Mono',monospace;color:var(--textMute);font-size:11px">—</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px">
      <span id="dot-toolbox" style="width:6px;height:6px;border-radius:99px;background:var(--textMute);flex-shrink:0"></span>
      <span style="color:var(--textDim);flex:1">toolbox</span>
      <span id="ver-toolbox" style="font-family:'JetBrains Mono',monospace;color:var(--textMute);font-size:11px">—</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px">
      <span id="dot-manifest" style="width:6px;height:6px;border-radius:99px;background:var(--textMute);flex-shrink:0"></span>
      <span style="color:var(--textDim);flex:1">manifest</span>
      <span id="ver-manifest" style="font-family:'JetBrains Mono',monospace;color:var(--textMute);font-size:11px">—</span>
    </div>
  </div>

  <!-- Bridges -->
  <div style="padding:12px 18px 6px;font-size:10px;letter-spacing:1.5px;color:var(--textMute);margin-top:12px;text-transform:uppercase">Bridges</div>
  <div style="padding:0 12px;display:flex;flex-direction:column;gap:4px">
    <div id="bridge-discord-row" style="display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px">
      <span id="dot-discord" style="width:6px;height:6px;border-radius:99px;background:var(--textMute);flex-shrink:0"></span>
      <span style="color:var(--textDim);flex:1">discord</span>
      <span id="bridge-discord-meta" style="font-family:'JetBrains Mono',monospace;color:var(--textMute);font-size:10px">—</span>
    </div>
    <div id="bridge-signal-row" style="display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px">
      <span id="dot-signal" style="width:6px;height:6px;border-radius:99px;background:var(--textMute);flex-shrink:0"></span>
      <span style="color:var(--textDim);flex:1">signal</span>
      <span id="bridge-signal-meta" style="font-family:'JetBrains Mono',monospace;color:var(--textMute);font-size:10px">—</span>
    </div>
  </div>

  <!-- Tools -->
  <div style="margin-top:auto;padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px">
    <button class="sidebar-btn" onclick="restartService('llama-swap')">↻ Restart Local Stack</button>
    <button class="sidebar-btn" onclick="restartService('manifest')">↻ Restart Manifest</button>
    <button class="sidebar-btn" onclick="restartService('brainrouter')">↻ Restart brainrouter</button>
    <button class="sidebar-btn" onclick="syncModels()">⇄ Sync Models</button>
  </div>
</nav>
<!-- MAIN COLUMN -->
<div id="main" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0">

  <!-- Command Bar -->
  <div id="cmdbar" style="padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:16px;flex-shrink:0">
    <div style="min-width:0">
      <h1 id="cmdbar-title" style="font-size:16px;font-weight:600;color:var(--text)">Stream</h1>
      <span id="cmdbar-sub" style="font-size:12px;color:var(--textMute)">Newest first · polling every 3s</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;background:var(--bg3);padding:6px 12px;border-radius:8px;border:1px solid var(--border);min-width:320px;flex:1;max-width:500px">
      <span style="color:var(--textMute);font-size:14px">⌕</span>
      <input id="search-input" placeholder="Search tasks, models... ⌘K" style="background:transparent;border:none;outline:none;color:var(--text);font-size:12px;flex:1;min-width:0" oninput="onSearch(this.value)">
      <span style="color:var(--textMute);font-size:10px;font-family:'JetBrains Mono',monospace;padding:2px 6px;border:1px solid var(--border);border-radius:4px">⌘K</span>
    </div>
    <div id="filter-btns" style="display:flex;gap:4px">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">all</button>
      <button class="filter-btn" data-filter="live" onclick="setFilter('live')">live</button>
      <button class="filter-btn" data-filter="approved" onclick="setFilter('approved')">approved</button>
      <button class="filter-btn" data-filter="escalated" onclick="setFilter('escalated')">escalated</button>
    </div>
  </div>

  <!-- Scrollable content -->
  <div id="content" style="flex:1;overflow:auto;padding:24px">

    <!-- Stream View -->
    <div id="stream-view" style="display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start">
      <div id="card-list" style="display:flex;flex-direction:column;gap:14px">
        <div style="color:var(--textMute);font-size:12px;padding:20px 0;text-align:center">Loading...</div>
      </div>
      <div id="right-rail" style="position:sticky;top:0;display:flex;flex-direction:column;gap:14px">
        <!-- Sankey panel -->
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px">
          <div style="font-size:10px;letter-spacing:1.5px;color:var(--textMute);margin-bottom:10px;text-transform:uppercase;font-family:'JetBrains Mono',monospace">FLOW · 24h</div>
          <div id="sankey-container" style="width:100%;overflow:hidden">
            <svg id="sankey-svg" viewBox="0 0 290 240" width="100%" style="display:block"></svg>
          </div>
        </div>
        <!-- KPI grid -->
        <div id="kpi-grid" style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <!-- filled by updateKPI() -->
        </div>
      </div>
    </div>

    <!-- Reviews View -->
    <div id="reviews-view" style="display:none">
      <div id="reviews-list" style="display:flex;flex-direction:column;gap:14px"></div>
    </div>

    <!-- Config View -->
    <div id="config-view" style="display:none;max-width:900px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">

        <!-- brainrouter config -->
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="font-size:13px;font-weight:600">brainrouter.yaml</div>
            <button class="save-btn" onclick="saveConfig()">Save</button>
          </div>
          <textarea id="config-br-textarea" class="config-input" rows="20" placeholder="Loading..."></textarea>
          <div id="config-br-msg" style="font-size:11px;color:var(--textMute);font-family:'JetBrains Mono',monospace;min-height:14px"></div>
        </div>

        <!-- llama-swap config -->
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="font-size:13px;font-weight:600">llama-swap config</div>
            <button class="save-btn" onclick="saveLlamaSwapConfig()">Save</button>
          </div>
          <textarea id="config-ls-textarea" class="config-input" rows="20" placeholder="Loading..."></textarea>
          <div id="config-ls-msg" style="font-size:11px;color:var(--textMute);font-family:'JetBrains Mono',monospace;min-height:14px"></div>
        </div>
      </div>

      <!-- Config files list -->
      <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px">
        <div style="font-size:13px;font-weight:600;margin-bottom:12px">Config files</div>
        <div id="config-files-list" style="display:flex;flex-direction:column;gap:6px">
          <div style="color:var(--textMute);font-size:12px">Loading config files...</div>
        </div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /main -->
</div><!-- /app -->
<script>
// ─── Design constants ────────────────────────────────────────────────────────
const SOURCES = {
  discord: { label: 'Discord', color: '#9d7bff', glyph: 'D' },
  signal:  { label: 'Signal',  color: '#3ec5ff', glyph: 'S' },
  local:   { label: 'Local',   color: '#22d39a', glyph: 'L' },
};
const HARNESSES = {
  omp:      { label: 'OMP',        color: '#22d39a' },
  droid:    { label: 'Droid',      color: '#3ec5ff' },
  cc:       { label: 'Claude Code',color: '#9d7bff' },
  opencode: { label: 'OpenCode',   color: '#f5b14a' },
  vibe:     { label: 'Vibe',       color: '#ff7ac6' },
};
const STATUS_MAP = {
  queued:     { c: '#5a6679', l: 'Queued',     pulse: false },
  routing:    { c: '#3ec5ff', l: 'Routing',    pulse: false },
  generating: { c: '#22d39a', l: 'Generating', pulse: true  },
  reviewing:  { c: '#f5b14a', l: 'Reviewing',  pulse: true  },
  approved:   { c: '#22d39a', l: 'Approved',   pulse: false },
  escalated:  { c: '#ff6b6b', l: 'Escalated',  pulse: false },
  failed:     { c: '#ff6b6b', l: 'Failed',     pulse: false },
  iterating:  { c: '#f5b14a', l: 'Iterating',  pulse: true  },
  pending:    { c: '#5a6679', l: 'Pending',    pulse: false },
};

// ─── State ───────────────────────────────────────────────────────────────────
let allEvents = [], allSessions = [], activeFilter = 'all', activeView = 'stream';
let inferenceStatus = null, healthData = {}, versionsData = {}, bridgeData = {}, statsData = {};
let searchQuery = '';

// ─── Helpers ─────────────────────────────────────────────────────────────────
async function safeFetch(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

function fmtAge(ts) {
  if (!ts) return '—';
  const d = Date.now() - new Date(ts).getTime();
  if (d < 0) return 'just now';
  if (d < 60000) return Math.floor(d/1000) + 's ago';
  if (d < 3600000) return Math.floor(d/60000) + 'm ago';
  if (d < 86400000) return Math.floor(d/3600000) + 'h ago';
  return new Date(ts).toLocaleDateString();
}

function fmtLatency(ms) {
  if (!ms || ms === 0) return '—';
  if (ms < 1000) return ms + 'ms';
  return (ms/1000).toFixed(1) + 's';
}

function fmtUptime(secs) {
  if (!secs) return '—';
  const h = Math.floor(secs/3600);
  const m = Math.floor((secs%3600)/60);
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

// ─── Derive helpers ───────────────────────────────────────────────────────────
function deriveSource(e) { return 'local'; }

function deriveRoute(e) {
  if (e.stage === 'cloud_primary') return e.bonsai_decision === 'cloud' ? 'cloud-direct' : 'cloud-auto';
  if (e.stage === 'cloud_fallback') return 'cloud-fallback';
  if (e.stage === 'local_primary') return 'local-auto';
  if (e.stage === 'local_fallback') return 'local-auto';
  return e.bonsai_decision === 'cloud' ? 'cloud-auto' : 'local-auto';
}

function deriveStatus(e, sess, inf) {
  if (!e.success && e.error) return 'failed';
  if (sess) {
    const ss = sess.status;
    if (ss === 'escalated') return 'escalated';
    if (ss === 'needs_revision') return 'reviewing';
    if (ss === 'approved') return 'approved';
    if (ss === 'pending') return e.success ? 'approved' : 'generating';
  }
  return e.success ? 'approved' : 'generating';
}

function enrichEvents(events, sessions) {
  const sessMap = {};
  sessions.forEach(s => { sessMap[s.id] = s; });
  return events.map(e => {
    const sess = e.session_id ? sessMap[e.session_id] : null;
    const _route = deriveRoute(e);
    const _status = deriveStatus(e, sess, inferenceStatus);
    return {
      ...e,
      _session: sess,
      _source: deriveSource(e),
      _route,
      _displayModel: e.model_key || (e.effective_provider ? e.effective_provider.split('/').pop() : '—'),
      _folder: e.cwd ? e.cwd.split('/').filter(Boolean).pop() : '',
      _status,
    };
  });
}

// ─── View switching ──────────────────────────────────────────────────────────
function switchView(view) {
  activeView = view;
  document.getElementById('stream-view').style.display   = view === 'stream'  ? 'grid'  : 'none';
  document.getElementById('reviews-view').style.display  = view === 'reviews' ? 'block' : 'none';
  document.getElementById('config-view').style.display   = view === 'config'  ? 'block' : 'none';

  ['stream','reviews','config'].forEach(v => {
    const btn = document.getElementById('nav-' + v);
    if (btn) btn.classList.toggle('active', v === view);
  });

  const titles = { stream: 'Stream', reviews: 'Reviews', config: 'Config' };
  document.getElementById('cmdbar-title').textContent = titles[view] || view;

  const subs = {
    stream: 'Newest first · polling every 3s',
    reviews: 'Active review sessions',
    config: 'Edit configuration files',
  };
  document.getElementById('cmdbar-sub').textContent = subs[view] || '';

  const filterDiv = document.getElementById('filter-btns');
  filterDiv.style.display = view === 'stream' ? 'flex' : 'none';

  if (view === 'config') loadConfig();
}

// ─── Filter ───────────────────────────────────────────────────────────────────
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderStream();
}

function onSearch(q) {
  searchQuery = q.toLowerCase();
  renderStream();
}

function matchesSearch(t) {
  if (!searchQuery) return true;
  const haystack = [
    t.prompt_excerpt || '',
    t._displayModel || '',
    t._folder || '',
    t.requested_model || '',
    t.effective_provider || '',
    t.session_id || '',
  ].join(' ').toLowerCase();
  return haystack.includes(searchQuery);
}

function matchesFilter(t) {
  if (activeFilter === 'all') return true;
  if (activeFilter === 'live') return ['queued','generating','reviewing','routing','iterating'].includes(t._status);
  if (activeFilter === 'approved') return t._status === 'approved';
  if (activeFilter === 'escalated') return t._status === 'escalated';
  return true;
}
</script>
<script>
// ─── Status pill HTML ─────────────────────────────────────────────────────────
function statusPill(status) {
  const x = STATUS_MAP[status] || STATUS_MAP.pending;
  const dot = x.pulse
    ? `<span class="pulse-dot" style="width:6px;height:6px;border-radius:99px;background:${x.c};box-shadow:0 0 6px ${x.c};display:inline-block"></span>`
    : `<span style="width:6px;height:6px;border-radius:99px;background:${x.c};box-shadow:0 0 6px ${x.c};display:inline-block"></span>`;
  return `<span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:99px;font-size:11px;background:${x.c}20;color:${x.c};border:1px solid ${x.c}40;white-space:nowrap;font-family:'JetBrains Mono',monospace;letter-spacing:0.3px">${dot}${x.l}</span>`;
}

// ─── Mini flow HTML ───────────────────────────────────────────────────────────
function miniFlowNode(label, color, sub) {
  return `<div style="display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:6px;background:${color}14;border:1px solid ${color}40;color:${color}">
    <span style="width:5px;height:5px;border-radius:99px;background:${color};box-shadow:0 0 5px ${color};flex-shrink:0"></span>
    <span style="font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:0.3px">${label}</span>
    ${sub ? `<span style="color:var(--textMute);font-size:10px">${sub}</span>` : ''}
  </div>`;
}

function miniFlowArrow() {
  return `<span style="color:var(--textMute);font-size:11px">→</span>`;
}

function miniFlowHtml(t) {
  const src = SOURCES[t._source] || SOURCES.local;
  const routeColor = (t._route || '').includes('cloud') ? '#9d7bff' : '#3ec5ff';
  const modelColor = (t._route || '').includes('cloud') ? '#9d7bff' : '#3ec5ff';
  const modelLabel = t._displayModel || '—';

  let nodes = [miniFlowNode(src.label, src.color)];
  nodes.push(miniFlowArrow());
  nodes.push(miniFlowNode(modelLabel, modelColor, (t._route || '').includes('cloud') ? 'cloud' : 'local'));
  if (t._session) {
    const rev = t._session.review_model || '—';
    nodes.push(miniFlowArrow());
    nodes.push(miniFlowNode('rev: ' + rev, '#f5b14a'));
  }
  return `<div style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">${nodes.join('')}</div>`;
}

// ─── Review section HTML ──────────────────────────────────────────────────────
function reviewHtml(sess, eventId) {
  if (!sess) return '';
  const st = sess.status;
  if (st === 'pending') return '';

  const feedbackBg = st === 'escalated' ? 'var(--redDim)' : 'var(--amberDim)';
  const feedbackBorder = st === 'escalated' ? 'var(--red)' : 'var(--amber)';
  const reviewSt = st === 'needs_revision' ? 'reviewing' : st;

  const iterText = sess.iteration_count != null ? `iter ${sess.iteration_count}/5` : '';
  const byText = sess.review_model ? `by ${sess.review_model}` : '';
  const metaParts = [iterText, byText].filter(Boolean).join(' · ');

  const feedback = sess.llm_feedback || sess.summary || '';

  let actionHtml = '';
  if (st === 'escalated') {
    actionHtml = `<div style="margin-left:36px;margin-top:10px;display:flex;gap:6px">
      <button class="br-btn" style="background:var(--redDim);color:var(--red);border-color:rgba(255,107,107,0.35)" onclick="sendFeedback('${sess.id}')">Send Feedback</button>
      <button class="br-btn" style="background:var(--amberDim);color:var(--amber);border-color:rgba(245,177,74,0.35)" onclick="continueReview('${sess.id}')">Continue iterating</button>
      <button class="br-btn" style="background:var(--greenDim);color:var(--green);border-color:rgba(34,211,154,0.35)" onclick="lgtmReview('${sess.id}')">LGTM</button>
    </div>`;
  }

  return `<div style="border-top:1px solid var(--border);background:var(--bg2);padding:12px 16px 14px;position:relative">
    <div style="position:absolute;left:30px;top:-1px;width:24px;height:14px;border-left:1px dashed var(--borderHi);border-bottom:1px dashed var(--borderHi);border-bottom-left-radius:6px"></div>
    <div style="display:flex;align-items:center;gap:10px;margin-left:36px;flex-wrap:wrap">
      <span style="font-size:10px;color:var(--textMute);font-family:'JetBrains Mono',monospace;letter-spacing:1px">↳ REVIEW</span>
      ${statusPill(reviewSt)}
      ${metaParts ? `<span style="font-size:11px;color:var(--textMute);font-family:'JetBrains Mono',monospace">${metaParts}</span>` : ''}
      ${st === 'escalated' ? `<span style="margin-left:auto;font-size:10px;color:var(--red);font-family:'JetBrains Mono',monospace">HUMAN NEEDED</span>` : ''}
    </div>
    ${feedback ? `<div style="margin-left:36px;margin-top:8px;padding:10px;background:${feedbackBg};border-left:2px solid ${feedbackBorder};border-radius:4px;font-size:12px;color:var(--text);line-height:1.5">${escHtml(feedback)}</div>` : ''}
    ${actionHtml}
  </div>`;
}

// ─── Card HTML ────────────────────────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCard(t) {
  const src = SOURCES[t._source] || SOURCES.local;
  const isLive = ['generating','reviewing','routing','iterating'].includes(t._status);
  const routeColor = (t._route || '').includes('cloud') ? '#9d7bff' : '#3ec5ff';

  const lat = fmtLatency(t.latency_ms);
  const latColor = t.latency_ms > 5000 ? '#f5b14a' : 'var(--textDim)';

  const folder = t._folder || '';
  const age = fmtAge(t.timestamp);
  const prompt = escHtml(t.prompt_excerpt || '(no prompt excerpt)');

  const errHtml = (t.error && !t.success)
    ? `<div style="margin-top:10px;padding:10px;background:var(--redDim);border-left:2px solid var(--red);border-radius:4px;font-size:12px;color:var(--text)">${escHtml(t.error)}</div>`
    : '';

  return `<article style="background:var(--panel);border:1px solid var(--border);border-left:3px solid ${src.color};border-radius:10px;overflow:hidden;position:relative">
    ${isLive ? '<div class="shimmer-bar"></div>' : ''}
    <!-- Header -->
    <header style="padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)">
      <div style="width:28px;height:28px;border-radius:8px;background:${src.color}22;border:1px solid ${src.color}55;display:flex;align-items:center;justify-content:center;color:${src.color};font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;flex-shrink:0">${src.glyph}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;color:var(--text)">
          <span style="color:${src.color};font-weight:600">${src.label}</span>
          ${t.cwd ? `<span style="color:var(--textMute);margin-left:6px">${escHtml(t.cwd)}</span>` : ''}
        </div>
        <div style="font-size:10.5px;color:var(--textMute);font-family:'JetBrains Mono',monospace;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
          ${escHtml(t.id)} · ${escHtml(folder)} · ${age}
        </div>
      </div>
      ${statusPill(t._status)}
    </header>
    <!-- Flow rail -->
    <div style="padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border)">
      ${miniFlowHtml(t)}
    </div>
    <!-- Body -->
    <div style="padding:16px;display:grid;grid-template-columns:1fr 200px;gap:16px">
      <div>
        <div style="font-size:13px;color:var(--text);line-height:1.55">${prompt}</div>
        ${errHtml}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--bg2);border-radius:6px;font-size:11px;font-family:'JetBrains Mono',monospace">
        <div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--textMute)">route</span><span style="color:${routeColor};text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(t._route || '—')}</span></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--textMute)">model</span><span style="color:${routeColor};text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(t._displayModel)}</span></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--textMute)">latency</span><span style="color:${latColor}">${lat}</span></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--textMute)">bonsai</span><span style="color:var(--textDim)">${escHtml(t.bonsai_decision || '—')}</span></div>
      </div>
    </div>
    <!-- Review subtask -->
    ${reviewHtml(t._session, t.id)}
  </article>`;
}
</script>
<script>
// ─── Sankey SVG ───────────────────────────────────────────────────────────────
function buildSankey(stats) {
  const W = 290, H = 240;
  const nodeW = 12;
  const headerH = 20;
  const usableH = H - headerH - 16;
  const padBetween = 5;

  // Build node data from statsData
  // Columns: Source | Route | Model
  // We derive from stats: total, cloud_count, local_count, direct_cloud_count, direct_local_count
  const total = stats.total || 1;
  const cloudCount = (stats.cloud_count || 0);
  const localCount = (stats.local_count || 0);
  const directCloud = (stats.direct_cloud_count || 0);
  const cloudAuto = Math.max(0, cloudCount - directCloud);
  const directLocal = (stats.direct_local_count || 0);
  const localAuto = Math.max(0, localCount - directLocal);

  const safePct = (n) => Math.max(2, (n / Math.max(total, 1)) * usableH);

  // Col 0: Source (we only know local, no bridge breakdown)
  const srcNodes = [{ key: 'all', label: 'All', color: '#22d39a', value: total, y: headerH + 8 }];
  srcNodes[0].h = usableH;

  // Col 1: Route
  const routes = [];
  if (directCloud > 0)  routes.push({ key: 'cloud-direct', label: 'cloud-direct', color: '#9d7bff', value: directCloud });
  if (cloudAuto > 0)    routes.push({ key: 'cloud-auto',   label: 'cloud-auto',   color: '#9d7bff', value: cloudAuto });
  if (directLocal > 0)  routes.push({ key: 'local-direct', label: 'local-direct', color: '#3ec5ff', value: directLocal });
  if (localAuto > 0)    routes.push({ key: 'local-auto',   label: 'local-auto',   color: '#3ec5ff', value: localAuto });

  if (routes.length === 0) {
    // No data: placeholder
    return `<text x="145" y="120" fill="#5a6679" font-size="11" font-family="JetBrains Mono, monospace" text-anchor="middle">No data yet</text>`;
  }

  const routeTotalH = usableH - (routes.length - 1) * padBetween;
  let ry = headerH + 8;
  routes.forEach(n => {
    n.h = Math.max(6, (n.value / total) * routeTotalH);
    n.y = ry;
    ry += n.h + padBetween;
  });

  const colX = [20, 148];
  const cols = [
    { header: 'SOURCE', x: colX[0], nodes: srcNodes },
    { header: 'ROUTE',  x: colX[1], nodes: routes   },
  ];

  let svg = '';

  // Headers
  cols.forEach(c => {
    svg += `<text x="${c.x}" y="14" fill="#5a6679" font-size="9" font-family="JetBrains Mono, monospace" letter-spacing="1.5">${c.header}</text>`;
  });

  // Links: all → each route
  routes.forEach(rt => {
    const x1 = colX[0] + nodeW;
    const x2 = colX[1];
    const y1 = srcNodes[0].y + srcNodes[0].h / 2;
    const y2 = rt.y + rt.h / 2;
    const w  = Math.max(1, rt.h * 0.5);
    const cx1 = x1 + (x2 - x1) * 0.5;
    const cx2 = x2 - (x2 - x1) * 0.5;
    svg += `<path d="M ${x1} ${y1} C ${cx1} ${y1}, ${cx2} ${y2}, ${x2} ${y2}" stroke="${rt.color}" stroke-width="${w}" fill="none" opacity="0.32"/>`;
  });

  // Nodes + labels
  cols.forEach(c => {
    c.nodes.forEach(n => {
      svg += `<rect x="${c.x}" y="${n.y}" width="${nodeW}" height="${n.h}" fill="${n.color}" rx="2"/>`;
      svg += `<text x="${c.x + nodeW + 6}" y="${n.y + n.h/2 + 3.5}" fill="#e6edf6" font-size="10" font-family="JetBrains Mono, monospace">${n.label}</text>`;
      svg += `<text x="${c.x + nodeW + 6}" y="${n.y + n.h/2 + 16}" fill="#5a6679" font-size="9" font-family="JetBrains Mono, monospace">${n.value}</text>`;
    });
  });

  return svg;
}

function updateSankey() {
  const svg = document.getElementById('sankey-svg');
  if (!svg) return;
  if (!statsData || !statsData.total) {
    svg.innerHTML = `<text x="145" y="120" fill="#5a6679" font-size="11" font-family="JetBrains Mono, monospace" text-anchor="middle">No routing data yet</text>`;
    return;
  }
  svg.innerHTML = buildSankey(statsData);
}

// ─── KPI tiles ────────────────────────────────────────────────────────────────
function kpiTile(label, value, color, sub) {
  return `<div style="padding:8px;background:var(--bg2);border-radius:6px;border:1px solid var(--border)">
    <div style="font-size:9px;letter-spacing:1.4px;color:var(--textMute);text-transform:uppercase;font-family:'JetBrains Mono',monospace">${label}</div>
    <div style="font-size:18px;font-family:'JetBrains Mono',monospace;color:${color};margin-top:2px;font-weight:500">${value}</div>
    ${sub ? `<div style="font-size:10px;color:var(--textMute)">${sub}</div>` : ''}
  </div>`;
}

function updateKPI() {
  const grid = document.getElementById('kpi-grid');
  if (!grid) return;
  const s = statsData;
  if (!s || !s.total) {
    grid.innerHTML = `<div style="grid-column:1/-1;color:var(--textMute);font-size:12px;text-align:center;padding:8px">No stats yet</div>`;
    return;
  }
  const total = s.total || 0;
  const cloud = s.cloud_count || 0;
  const local = s.local_count || 0;
  const directCloud = s.direct_cloud_count || 0;
  const fallbacks = s.fallbacks || 0;
  const avg = s.avg_latency ? (s.avg_latency / 1000).toFixed(1) + 's' : '—';
  const cloudPct = total > 0 ? Math.round(cloud/total*100) + '%' : '—';
  const localPct = total > 0 ? Math.round(local/total*100) + '%' : '—';

  grid.innerHTML =
    kpiTile('Total', total, '#3ec5ff') +
    kpiTile('Direct cloud', directCloud, '#22d39a', cloudPct) +
    kpiTile('Cloud', cloud, '#9d7bff', cloudPct) +
    kpiTile('Local', local, '#3ec5ff', localPct) +
    kpiTile('Fallbacks', fallbacks, '#f5b14a') +
    kpiTile('Avg latency', avg, '#3ec5ff');
}
</script>
<script>
// ─── Render stream ────────────────────────────────────────────────────────────
function renderStream() {
  const list = document.getElementById('card-list');
  if (!list) return;

  const enriched = enrichEvents(allEvents, allSessions);
  const filtered = enriched.filter(t => matchesFilter(t) && matchesSearch(t));

  // Sort newest first
  filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

  if (filtered.length === 0) {
    const msg = allEvents.length === 0
      ? 'No routing events yet. Events appear here as requests flow through brainrouter.'
      : 'No events match the current filter.';
    list.innerHTML = `<div style="color:var(--textMute);font-size:12px;padding:40px 0;text-align:center;line-height:1.7">${msg}</div>`;
    return;
  }

  list.innerHTML = filtered.map(t => renderCard(t)).join('');
}

// ─── Render reviews view ──────────────────────────────────────────────────────
function renderReviews() {
  const list = document.getElementById('reviews-list');
  if (!list) return;

  const pending = allSessions.filter(s => ['pending','needs_revision','escalated'].includes(s.status));

  // Update badge
  const badge = document.getElementById('reviews-count');
  if (badge) {
    const active = allSessions.filter(s => ['needs_revision','escalated'].includes(s.status)).length;
    badge.textContent = active;
    badge.style.display = active > 0 ? 'inline' : 'none';
  }

  if (pending.length === 0) {
    list.innerHTML = `<div style="color:var(--textMute);font-size:12px;padding:40px 0;text-align:center">No active review sessions.</div>`;
    return;
  }

  list.innerHTML = pending.map(sess => {
    const st = sess.status === 'needs_revision' ? 'reviewing' : sess.status;
    const feedbackBg = sess.status === 'escalated' ? 'var(--redDim)' : 'var(--amberDim)';
    const feedbackBorder = sess.status === 'escalated' ? 'var(--red)' : 'var(--amber)';
    const feedback = sess.llm_feedback || sess.summary || '';
    const age = fmtAge(sess.updated_at);
    const iterText = sess.iteration_count != null ? `iter ${sess.iteration_count}/5` : '';
    const byText = sess.review_model ? `by ${sess.review_model}` : '';
    const meta = [iterText, byText, age].filter(Boolean).join(' · ');

    let actionHtml = '';
    if (sess.status === 'escalated') {
      actionHtml = `<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="br-btn" style="background:var(--redDim);color:var(--red);border-color:rgba(255,107,107,0.35)" onclick="sendFeedback('${sess.id}')">Send Feedback</button>
        <button class="br-btn" style="background:var(--amberDim);color:var(--amber);border-color:rgba(245,177,74,0.35)" onclick="continueReview('${sess.id}')">Continue iterating</button>
        <button class="br-btn" style="background:var(--greenDim);color:var(--green);border-color:rgba(34,211,154,0.35)" onclick="lgtmReview('${sess.id}')">LGTM</button>
      </div>`;
    }

    return `<div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <span style="font-size:12px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--text)">${escHtml(sess.id)}</span>
        ${statusPill(st)}
        <span style="font-size:11px;color:var(--textMute);font-family:'JetBrains Mono',monospace">${meta}</span>
        ${sess.status === 'escalated' ? `<span style="margin-left:auto;font-size:10px;color:var(--red);font-family:'JetBrains Mono',monospace">HUMAN NEEDED</span>` : ''}
      </div>
      ${sess.cwd ? `<div style="font-size:11px;color:var(--textMute);font-family:'JetBrains Mono',monospace;margin-bottom:8px">${escHtml(sess.cwd)}</div>` : ''}
      ${feedback ? `<div style="padding:10px;background:${feedbackBg};border-left:2px solid ${feedbackBorder};border-radius:4px;font-size:12px;color:var(--text);line-height:1.5">${escHtml(feedback)}</div>` : ''}
      ${actionHtml}
    </div>`;
  }).join('');
}

// ─── Health / sidebar updates ─────────────────────────────────────────────────
function updateDot(id, up) {
  const el = document.getElementById('dot-' + id);
  if (!el) return;
  const color = up ? '#22d39a' : '#ff6b6b';
  el.style.background = color;
  el.style.boxShadow = up ? `0 0 8px ${color}` : 'none';
}

function updateHealth() {
  const h = healthData;
  if (!h) return;

  const services = ['llama_swap','llama_cpp','toolbox','manifest'];
  const dotIds   = ['llama-swap','llama-cpp','toolbox','manifest'];
  const verIds   = ['ver-llama-swap','ver-llama-cpp','ver-toolbox','ver-manifest'];

  services.forEach((svc, i) => {
    const info = h[svc];
    if (!info) return;
    updateDot(dotIds[i], info.healthy !== false);
    const verEl = document.getElementById(verIds[i]);
    if (verEl && info.version) verEl.textContent = String(info.version).slice(0, 12);
  });
}

function updateBridges() {
  const b = bridgeData;
  if (!b) return;

  const disc = b.discord;
  if (disc) {
    updateDot('discord', disc.connected);
    const meta = document.getElementById('bridge-discord-meta');
    if (meta) {
      const msgs = disc.messages_handled != null ? disc.messages_handled + ' msg' : '—';
      const uptime = disc.uptime_secs != null ? fmtUptime(disc.uptime_secs) : '';
      meta.textContent = [msgs, uptime].filter(Boolean).join(' · ');
    }
  }

  const sig = b.signal;
  if (sig) {
    updateDot('signal', sig.connected);
    const meta = document.getElementById('bridge-signal-meta');
    if (meta) {
      const msgs = sig.messages_handled != null ? sig.messages_handled + ' msg' : '—';
      const uptime = sig.uptime_secs != null ? fmtUptime(sig.uptime_secs) : '';
      meta.textContent = [msgs, uptime].filter(Boolean).join(' · ');
    }
  }
}

function updateVersions() {
  const v = versionsData;
  if (!v) return;
  const brEl = document.getElementById('ver-brainrouter');
  if (brEl && v.brainrouter) brEl.textContent = 'v' + v.brainrouter;
}

// ─── Action handlers ──────────────────────────────────────────────────────────
async function restartService(svc) {
  const btn = event && event.target;
  if (btn) { btn.disabled = true; btn.textContent = '↻ Restarting...'; }
  try {
    await fetch('/api/restart/' + svc, { method: 'POST' });
  } catch(e) {}
  if (btn) {
    btn.disabled = false;
    const labels = { 'llama-swap': 'Restart Local Stack', 'manifest': 'Restart Manifest', 'brainrouter': 'Restart brainrouter' };
    btn.textContent = '↻ ' + (labels[svc] || svc);
  }
  setTimeout(refreshHealth, 2000);
}

async function syncModels() {
  const btn = event && event.target;
  if (btn) { btn.disabled = true; btn.textContent = '⇄ Syncing...'; }
  try { await fetch('/api/models/sync-omp', { method: 'POST' }); } catch(e) {}
  if (btn) { btn.disabled = false; btn.textContent = '⇄ Sync Models'; }
}

async function sendFeedback(sessionId) {
  const msg = prompt('Enter feedback for the review session:');
  if (!msg) return;
  try {
    await fetch('/review/session/' + sessionId + '/resolve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ feedback: msg, action: 'feedback' }),
    });
  } catch(e) {}
  await refreshFast();
}

async function continueReview(sessionId) {
  try {
    await fetch('/review/api/continue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId }),
    });
  } catch(e) {}
  await refreshFast();
}

async function lgtmReview(sessionId) {
  try {
    await fetch('/review/api/lgtm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId }),
    });
  } catch(e) {}
  await refreshFast();
}
</script>
<script>
// ─── Config page ──────────────────────────────────────────────────────────────
let configLoaded = false;

async function loadConfig() {
  if (configLoaded) return;
  configLoaded = true;

  const [brRes, lsRes, filesRes] = await Promise.all([
    safeFetch('/api/config'),
    safeFetch('/api/llama-swap-config'),
    safeFetch('/api/config-files'),
  ]);

  const brTa = document.getElementById('config-br-textarea');
  const lsTa = document.getElementById('config-ls-textarea');

  if (brRes) {
    if (brTa) brTa.value = typeof brRes === 'string' ? brRes : (brRes.content || JSON.stringify(brRes, null, 2));
  }
  if (lsRes) {
    if (lsTa) lsTa.value = typeof lsRes === 'string' ? lsRes : (lsRes.content || JSON.stringify(lsRes, null, 2));
  }

  const filesEl = document.getElementById('config-files-list');
  if (filesEl && filesRes) {
    const files = Array.isArray(filesRes) ? filesRes : (filesRes.files || []);
    if (files.length === 0) {
      filesEl.innerHTML = '<div style="color:var(--textMute);font-size:12px">No config files found.</div>';
    } else {
      filesEl.innerHTML = files.map(f => {
        const name = typeof f === 'string' ? f : (f.name || f.path || String(f));
        const path = typeof f === 'string' ? f : (f.path || f.name || String(f));
        return `<div class="file-card" onclick="openEditor('${escHtml(path)}')">
          <span style="font-size:14px;color:var(--textMute)">⚙</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text)">${escHtml(name)}</span>
        </div>`;
      }).join('');
    }
  }
}

async function saveConfig() {
  const ta = document.getElementById('config-br-textarea');
  const msgEl = document.getElementById('config-br-msg');
  if (!ta || !msgEl) return;
  try {
    const r = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: ta.value }),
    });
    msgEl.style.color = r.ok ? 'var(--green)' : 'var(--red)';
    msgEl.textContent = r.ok ? 'Saved.' : 'Error: ' + r.status;
  } catch(e) {
    msgEl.style.color = 'var(--red)';
    msgEl.textContent = 'Network error.';
  }
  setTimeout(() => { msgEl.textContent = ''; }, 3000);
}

async function saveLlamaSwapConfig() {
  const ta = document.getElementById('config-ls-textarea');
  const msgEl = document.getElementById('config-ls-msg');
  if (!ta || !msgEl) return;
  try {
    const r = await fetch('/api/llama-swap-config', {

async function openEditor(path) {
  try {
    await fetch('/api/open-editor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path }),
    });
  } catch(e) {}
}

// ─── Polling ──────────────────────────────────────────────────────────────────
async function refreshFast() {
  const [evRes, sesRes, stRes, infRes] = await Promise.all([
    safeFetch('/api/routing-events'),
    safeFetch('/review/api/sessions'),
    safeFetch('/api/routing-stats'),
    safeFetch('/api/inference-status'),
  ]);

  if (evRes) allEvents = Array.isArray(evRes.events) ? evRes.events : (Array.isArray(evRes) ? evRes : []);
  if (sesRes) allSessions = Array.isArray(sesRes.sessions) ? sesRes.sessions : (Array.isArray(sesRes) ? sesRes : []);
  if (stRes) statsData = stRes;
  if (infRes) inferenceStatus = infRes;

  if (activeView === 'stream') renderStream();
  if (activeView === 'reviews') renderReviews();
  else renderReviews(); // always update badge

  updateSankey();
  updateKPI();
}

async function refreshHealth() {
  const res = await safeFetch('/api/service-health');
  if (res) {
    healthData = res;
    updateHealth();
  }
}

async function refreshSlow() {
  const [verRes, bridgeRes] = await Promise.all([
    safeFetch('/api/versions'),
    safeFetch('/api/bridge-status'),
  ]);
  if (verRes) { versionsData = verRes; updateVersions(); }
  if (bridgeRes) { bridgeData = bridgeRes; updateBridges(); }
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
// Keyboard shortcut ⌘K / Ctrl+K → focus search
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    const inp = document.getElementById('search-input');
    if (inp) inp.focus();
  }
});

// Initial load
refreshFast();
refreshHealth();
refreshSlow();

// Poll intervals
setInterval(refreshFast, 3000);
setInterval(refreshHealth, 10000);
setInterval(refreshSlow, 30000);
</script>
