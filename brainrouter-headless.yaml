# brainrouter-headless.yaml — LLM routing configuration (no bridge transports)
#
# Same as brainrouter.yaml but without the signal bridge (Java/signal-cli).
# Used when booting into headless/multi-user mode (no GUI).
# See brainrouter.yaml for the full GUI-mode config with Discord + Signal.

manifest:
  base_url: "http://localhost:3001/v1"
  enabled: true
  api_key_env: MANIFEST_API_KEY

llama_swap:
  base_url: "http://localhost:8081/v1"
  fallback_model: "dirk-qwen3.8-27b-q4-subs"
  local_models:
    - "dirk-qwen3.8-27b-q8-nudge"
    - "dirk-qwen3.8-27b-q4-subs"
  subs_model: "dirk-qwen3.8-27b-q4-subs"
  nudge:
    enabled: true
    model_key: "dirk-qwen3.8-27b-q8-nudge"
    budgets:
      light: 10240
      deep: 12288

bonsai:
  enabled: false
  model_path: "/mnt/models/prism/Bonsai-27B-Q1_0.gguf"
  server_port: 9200
  fork_path: "/home/papa/.local/share/brainrouter/llama-prism/llama-server"

review:
  forced_mode: cloud
  # Reviews are judged by DeepSeek V4.1 Flash through Manifest (DeepInfra). Without this the
  # review request carries no model and Manifest answers with its own default.
  forced_model: "deepinfra/deepseek-ai/DeepSeek-V4-Flash"
  hankndory_integration: true
  # One global path, resolved inside the repo under review. It names OpenASMR's design document;
  # when reviewing ai/projects/intuit, switch it back to docs/design/rocket-di-demo.md, or a
  # design-aware review fails closed and escalates because the file is absent from that repo.
  design_doc_path: docs/design/raon1-mini-engines.md

# Bridge transports — omitted in headless mode.
# Discord and Signal bridges require a display server / GUI session.
# bridge:
#   omp_path: "/home/papa/.bun/bin/omp"
#   work_dir: "/home/papa/ai/projects"

benchmarks:
  database_path: /home/papa/.local/share/brainrouter/benchmarks.sqlite3
  lab:
    enabled: true
    riddllr_root: /home/papa/ai/projects/riddllr
    plumebench_root: /home/papa/ai/projects/plumebench
    workspace_path: /home/papa/.local/share/brainrouter/benchmark-lab
    omp_bin: /home/papa/.bun/bin/omp
    plumebench_sandbox_bin: /usr/bin/bwrap
    python_bin: /usr/bin/python3
    max_job_seconds: 1800
    riddllr_max_tokens: 4096
    plumebench_max_turns: 50
    plumebench_thinking: high
