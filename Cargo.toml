[package]
name = "brainrouter"
version = "1.1.9"
edition = "2021"

[dependencies]
# HTTP server — raw hyper for minimal proxy overhead
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for cloud providers
reqwest = { version = "0.12", features = ["stream", "json"] }

# Streaming
bytes = "1"
futures-util = { version = "0.3", features = ["io"] }


# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled", "limits"] }
sha2 = "0.10"
url = "2"
shlex = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# Utilities
pin-project = "1"
tokio-stream = "0.1"
num_cpus = "1.16"
encoding_rs = "0.8"

# Session IDs
uuid = { version = "1", features = ["v4"] }

# Plugin manifests (`plugin.toml`) — v2 L2 plugin core
toml = "0.8"
# Atomic owner-only writes (credentials store, plugin state)
tempfile = "3"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
flate2 = "1.1.9"
tar = "0.4.45"


[features]
default = []
# v2 R2 (docs/design/v2-streamlining.md): the benchmark explorer (HTTP
# routes + native lab) is opt-in. NOT part of `default`: stock builds
# answer the documented 503 degradation envelope on /benchmarks and
# /api/benchmarks/*; core routing is unaffected.
benchmarks = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
anyhow = "1"
bytes = "1"
futures-util = "0.3"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
tempfile = "3"
brainrouter = { path = "." }
