# brainrouter.example.yaml
#
# Copy to ~/.config/brainrouter/brainrouter.yaml and fill in your paths and URLs.
# The daemon loads this file by default (override with --config).
#
# Flow:
#   harness → brainrouter → Bonsai classifies query
#     Cloud → Manifest (your local cloud LLM router)
#     Local → llama-swap (your local model runner)
#   Manifest failure → llama-swap fallback_model

manifest:
  # Manifest is OFF by default. Set enabled: true to route cloud traffic to
  # your Manifest instance (docker compose, default port 2099).
  enabled: false
  # URL of your Manifest instance (docker compose, default port 2099)
  base_url: "http://localhost:2099/v1"
  # Name of the env var holding your Manifest API key (mnfst_* format),
  # NOT the key itself — the daemon does std::env::var(api_key_env).
  api_key_env: MANIFEST_API_KEY

# v2 L7 `swap:` section (pre-v2.0-p7 name: `llama_swap:`; the migration renames
# it in place — key values move verbatim and `base_url` is dropped, because the
# shim URL is fixed and native mode uses the swap supervisor).
swap:
  # Which engine serves local traffic:
  #   shim   — llama-swap (today's behavior; the default)
  #   native — the swap supervisor (boot refuses while the shim holds loaded
  #            models: flush them, then restart)
  mode: shim
  # Import source for the native catalog (the llama-swap config to take over).
  # Default: ~/.config/llama-swap/config.yaml. Fedora hosts point this at the
  # docker-mounted file, e.g. /opt/ai/llama-swap/config.yaml.
  # config_path: "/opt/ai/llama-swap/config.yaml"
  # Model key to use when Manifest fails, or when Bonsai picks Local
  # without a specific model. Must match a key in your llama-swap config.
  fallback_model: "your-local-model-key"
  # Optional: list of model keys served by llama-swap. Requests with any of
  # these as model= bypass Bonsai entirely and go straight to llama-swap.
  # Useful when clients (IDEs, scripts) set a specific model name directly.
  # local_models:
  #   - "qwen3"
  #   - "mistral-7b"
  #   - "your-local-model-key"
  # Optional: subs-pool model key. Requests with model=subs or brainrouter/subs
  # route directly to this llama-swap key, bypassing Bonsai — a multi-slot
  # pool for subagent traffic (e.g. 4 parallel slots on a bounded context).
  # Absent → subs requests fall back to normal auto routing.
  # subs_model: "your-subs-pool-key"
  # Reasoning-budget nudge (voidsurfer/llama.cpp-nudge fork). When enabled,
  # auto-routed local requests use model_key carrying a per-request
  # reasoning_budget_tokens chosen from budgets by Bonsai's tier.
  # nudge:
  #   enabled: true
  #   model_key: "your-nudge-model-key"
  #   budgets:
  #     light: 10240
  #     deep: 12288

# v2 L3: the v1 `bonsai:` block is the decision slot (`decision_model:`, see
# below). A config with `bonsai:` boots by migrating it once at startup
# (kind openai-compatible + prompt_profile bonsai; the GGUF/fork/port move
# under decision_model.launch).
decision_model:
  # The slot is OFF by default — model=auto routes straight to local
  # (llama-swap), the v1 classifier-off parity anchor.
  enabled: false
  # heuristic (default) | openai-compatible | structured-schema | webhook | plugin
  kind: heuristic
  # openai-compatible (the v1 Bonsai wire): endpoint + model + prompt_profile:
  #   kind: openai-compatible
  #   base_url: "http://127.0.0.1:9200"  # daemon appends /v1/chat/completions
  #   model: bonsai
  #   prompt_profile: bonsai
  # webhook: url: "https://router.internal/decide" (features JSON, no excerpt)
  # plugin:  plugin_id: "<installed plugin id>" (decision.classify)
  # timeout_ms: 5000
  # Managed llama-server launch backend (v1 bonsai.fork_path/model_path/server_port):
  # launch:
  #   server_port: 9200
  #   fork_path: "/home/yourname/.local/share/brainrouter/llama-prism/llama-server"
  #   # Absolute GGUF path (${models_path} shorthand available). Download:
  #   # huggingface-cli download bartowski/prism-ml_Bonsai-8B-unpacked-GGUF \
  #   #   --include "prism-ml_Bonsai-8B-unpacked-Q4_K_M.gguf" --local-dir /opt/models/bonsai
  #   model_path: "${models_path}/bonsai/prism-ml_Bonsai-8B-unpacked-Q4_K_M.gguf"

# Shared model storage directory.
# All fields are optional — defaults shown.
models:
  # Where GGUF model files live on this machine.
  # Default: /opt/models
  path: /opt/models

  # Who may add or delete files in this directory.
  #
  #   false (default) — only the directory owner (e.g. root or papa) can write;
  #                     other aistack members can read/traverse but not modify.
  #                     Permissions: root:aistack 750
  #
  #   true            — all aistack group members may add and delete models.
  #                     Permissions: root:aistack 770
  #
  # This setting controls what the installer writes; the brainrouter daemon
  # itself does not modify files in this directory.
  shared_write: false

# Imported benchmark results and explorer storage.
# The daemon creates and migrates this SQLite database at startup. It only
# imports and explores results; it never launches benchmark/model workloads.
# Initialization failures disable only the explorer (HTTP 503), not routing.
# Fix the database/path and restart Brainrouter to retry initialization.
# benchmarks:
#   database_path: "/home/yourname/.local/share/brainrouter/benchmarks.sqlite3"

# Review loop configuration (v2 L3: model selection lives on the review
# role card, NOT here — `forced_mode`/`forced_model` are consumed by the
# v2.0-p3 migration and rejected by the reduced schema).
# review:
#   max_iterations: 5          # LLM review rounds before escalating to human
#   hankndory_integration: false
#   design_doc_path: null

# Role cards replace the v1 `routing:` profile block and per-project pins.
# Set them via the dashboard (role-card strip) or CLI:
#   brainrouter cli roles set main local
#   brainrouter cli roles set review cloud/vendor/reviewer-model
#   brainrouter cli roles set subagent cloud --project /path/to/repo
# They persist in $XDG_STATE_HOME/brainrouter/role_cards.json (0600).
# v1 configs with `routing:`/`forced_*`/`bonsai:` migrate once at boot
# (`brainrouter migration restore v2.0-p3` rolls back).

# Decision slot (the v1 `bonsai:` block's successor; selects the `auto`
# route). kind: heuristic (default, parity anchor) | openai-compatible
# (the v1 Bonsai wire: prompt_profile bonsai) | structured-schema |
# webhook | plugin. Launch backend (the managed llama-server) goes under
# `launch:`.
# decision_model:
#   enabled: false
#   kind: heuristic
#   timeout_ms: 5000          # per-decision bound for networked kinds


# Bridge transports — forward Discord/Signal messages to OMP (all optional)
# bridge:
#   omp_path: "omp"                          # Path to omp binary (default: "omp" in $PATH)
#   work_dir: "~/ai/projects"                 # Sandbox root for omp invocations
#   aliases_config: "~/.config/omp-bridge/config.yaml"  # Model alias map
#   timeout_secs: 600                         # Per-invocation timeout
#   default_model: "brainrouter/auto"         # Routes through Bonsai classification
#   discord:
#     enabled: true
#     token: "your-discord-bot-token"
#     prefix: "!"                             # Command prefix (default: !)
#   signal:
#     enabled: true
#     account: "+1234567890"                  # E.164 phone number
#     storage_path: "~/.local/share/signal-cli" # passed to signal-cli --config
#     prefix: "!"                             # Command prefix (default: !)
#     llama_swap_url: "http://localhost:8081"  # For model listing command