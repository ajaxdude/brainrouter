# brainrouter.example.yaml
#
# Copy to ~/.config/brainrouter/brainrouter.yaml and fill in your paths and URLs.
# The daemon loads this file by default (override with --config).
#
# Flow:
#   harness → brainrouter → Bonsai classifies query
#     Cloud → Manifest (your local cloud LLM router)
#     Local → llama-swap (your local model runner)
#   Manifest failure → llama-swap fallback_model

manifest:
  # URL of your Manifest instance (docker compose, default port 2099)
  base_url: "http://localhost:2099/v1"
  # Name of the env var holding your Manifest API key (mnfst_* format)
  api_key_env: MANIFEST_API_KEY

llama_swap:
  # URL of your llama-swap instance
  base_url: "http://localhost:8081/v1"
  # Model key to use when Manifest fails, or when Bonsai picks Local
  # without a specific model. Must match a key in your llama-swap config.
  fallback_model: "your-local-model-key"
  # Optional: list of model keys served by llama-swap. Requests with any of
  # these as model= bypass Bonsai entirely and go straight to llama-swap.
  # Useful when clients (IDEs, scripts) set a specific model name directly.
  # local_models:
  #   - "qwen3"
  #   - "mistral-7b"
  #   - "your-local-model-key"

bonsai:
  # Absolute path to the Bonsai GGUF file.
  # You may use ${models_path} as a shorthand for the models.path value below.
  # Download: huggingface-cli download bartowski/prism-ml_Bonsai-8B-unpacked-GGUF \
  #             --include "prism-ml_Bonsai-8B-unpacked-Q4_K_M.gguf" \
  #             --local-dir /opt/models/bonsai
  model_path: "${models_path}/bonsai/prism-ml_Bonsai-8B-unpacked-Q4_K_M.gguf"

# Shared model storage directory.
# All fields are optional — defaults shown.
models:
  # Where GGUF model files live on this machine.
  # Default: /opt/models
  path: /opt/models

  # Who may add or delete files in this directory.
  #
  #   false (default) — only the directory owner (e.g. root or papa) can write;
  #                     other aistack members can read/traverse but not modify.
  #                     Permissions: root:aistack 750
  #
  #   true            — all aistack group members may add and delete models.
  #                     Permissions: root:aistack 770
  #
  # This setting controls what the installer writes; the brainrouter daemon
  # itself does not modify files in this directory.
  shared_write: false

